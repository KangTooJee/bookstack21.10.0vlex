name: bookstack-21111-lab
services:
  db:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
      DISABLE_EXTERNAL_SERVICES: "true"
      DRAWIO: ${DRAWIO:-false}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_DRIVER: log
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      FILE_UPLOAD_SIZE_LIMIT: 20
      VLEX_STORAGE_MAX_MB: ${VLEX_STORAGE_MAX_MB:-20}
    volumes:
      - storage:/var/www/html/storage
      - uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  storage:
  uploads:
